sync-github:
  image: alpine/git:latest
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_MIRROR_TOKEN'
  script:
    - git clone --mirror "$CI_REPOSITORY_URL" repository.git
    - cd repository.git
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/ePay/magento2-epic-payment-module.git"
    - git push --mirror github
